# Example node config — explicit package shopping list (see packages/ layout).
# Pick the packages you need; pre-heater and GHE are optional extras.
# For local development from a git clone, use zehnder-comfoair-q.local.yml instead.
substitutions:
  device_name: zehnder-comfoair-q-can
  # entity_prefix: "comfoair "        # default; entity names become "comfoair Fan Level" etc.
  # ota_password: !secret ota_password # uncomment to enable OTA auth
  # CAN pins (defaults GPIO4/GPIO5, see packages/comfoair/base.yml):
  # can_tx_pin: GPIO4
  # can_rx_pin: GPIO5

api:
  encryption:
    key: !secret api_encryption_key

# ---------------------------------------------------------------------------
# Packages (map form for base, shorthand for the rest).
# Pin a ref (tag or commit) and set refresh for reproducible remote builds.
# ---------------------------------------------------------------------------
packages:
  base:
    url: https://github.com/Jabe/esphome-zehnder-comfoair-q-can
    file: packages/core/base.yml
    ref: v2.3.0
    refresh: 1d

  board: github://Jabe/esphome-zehnder-comfoair-q-can/packages/boards/esp32dev.yml@v2.3.0
  network: github://Jabe/esphome-zehnder-comfoair-q-can/packages/connectivity/ethernet-lan8720.yml@v2.3.0
  comfoair: github://Jabe/esphome-zehnder-comfoair-q-can/packages/comfoair/base.yml@v2.3.0
  sensors: github://Jabe/esphome-zehnder-comfoair-q-can/packages/comfoair/sensors.yml@v2.3.0
  computed: github://Jabe/esphome-zehnder-comfoair-q-can/packages/comfoair/computed.yml@v2.3.0
  controls: github://Jabe/esphome-zehnder-comfoair-q-can/packages/comfoair/controls.yml@v2.3.0
  # Setup/tuning numbers — typically included once for setup, then removed:
  # tuning: github://Jabe/esphome-zehnder-comfoair-q-can/packages/comfoair/tuning.yml@v2.3.0
  # Only for units with the respective hardware installed:
  # erv: github://Jabe/esphome-zehnder-comfoair-q-can/packages/comfoair/erv.yml@v2.3.0  # units with an enthalpy exchanger
  # pre_heater: github://Jabe/esphome-zehnder-comfoair-q-can/packages/comfoair/pre_heater.yml@v2.3.0
  # ghe: github://Jabe/esphome-zehnder-comfoair-q-can/packages/comfoair/ghe.yml@v2.3.0

# Top-level blocks deep-merge into the packages — no fork, no !extend needed.
# Example: esp-idf advanced options on top of the board package:
# esp32:
#   framework:
#     advanced:
#       minimum_chip_revision: "3.0"
