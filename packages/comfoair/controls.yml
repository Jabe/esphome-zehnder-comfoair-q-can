# Controls: selects and a switch with real state sync from the unit's PDOs,
# plus boost timer buttons. The passive temperature / humidity selects are RMI
# properties without a state PDO — they publish optimistically after sending.
substitutions:
  entity_prefix: "comfoair "
  # fan level timer buttons ("Party Timer"); override via vars without forking
  boost_1_name: "Boost 15 Min."
  boost_1_level: "3"
  boost_1_duration: 15min
  boost_2_name: "Boost 30 Min."
  boost_2_level: "3"
  boost_2_duration: 30min

select:
  - platform: zehnder_comfoair_q
    fan_level: {id: fan_level, name: "${entity_prefix}Fan Level"}
    bypass_mode: {id: bypass_mode, name: "${entity_prefix}Bypass Mode"}
    temperature_profile: {id: temperature_profile, name: "${entity_prefix}Temperature Profile"}
    passive_temperature: {id: passive_temperature, name: "${entity_prefix}Passive Temperature"}
    humidity_comfort: {id: humidity_comfort, name: "${entity_prefix}Humidity Comfort"}
    humidity_protection: {id: humidity_protection, name: "${entity_prefix}Humidity Protection"}

switch:
  - platform: zehnder_comfoair_q
    manual_mode: {id: manual_mode, name: "${entity_prefix}Manual Mode"}

# temperature profile target temperatures (RMI properties, read back from the unit)
number:
  - platform: zehnder_comfoair_q
    profile_target_warm: {id: profile_target_warm, name: "${entity_prefix}Profile Target Warm"}
    profile_target_normal: {id: profile_target_normal, name: "${entity_prefix}Profile Target Normal"}
    profile_target_cool: {id: profile_target_cool, name: "${entity_prefix}Profile Target Cool"}

button:
  - platform: zehnder_comfoair_q
    fan_level_timers:
      - id: boost_1
        name: "${entity_prefix}${boost_1_name}"
        level: ${boost_1_level}
        duration: ${boost_1_duration}
      - id: boost_2
        name: "${entity_prefix}${boost_2_name}"
        level: ${boost_2_level}
        duration: ${boost_2_duration}
    fan_level_timer_off:
      id: boost_off
      name: "${entity_prefix}Boost off"
