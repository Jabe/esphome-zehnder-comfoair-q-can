# Sensors computed from other PDO values inside the component (updated every
# 60s). The source PDOs are requested automatically, even if their own sensor
# entities are not configured.
substitutions:
  entity_prefix: "comfoair "

# the enthalpy/humidity recovery ratios live in erv.yml — they are only
# meaningful on units with an enthalpy exchanger (ERV)
sensor:
  - platform: zehnder_comfoair_q
    indoor_air_temp_diff: {id: indoor_air_temp_diff, name: "${entity_prefix}Indoor Air Temp Diff"}
    outdoor_air_temp_diff: {id: outdoor_air_temp_diff, name: "${entity_prefix}Outdoor Air Temp Diff"}
    heat_recovery_ratio: {id: heat_recovery_ratio, name: "${entity_prefix}Heat Recovery Ratio"}
    supply_thermal_power: {id: supply_thermal_power, name: "${entity_prefix}Supply Thermal Power"}
    ventilation_heat_loss: {id: ventilation_heat_loss, name: "${entity_prefix}Ventilation Heat Loss"}
    specific_fan_power: {id: specific_fan_power, name: "${entity_prefix}Specific Fan Power"}
