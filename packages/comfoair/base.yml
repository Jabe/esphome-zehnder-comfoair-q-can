# ComfoAir Q core: CAN bus + component hub. CAN bitrate (50kbps) and extended
# ids are set by the component itself; PDOs are requested automatically for
# all configured entities (see the entity packages next to this file).
substitutions:
  can_tx_pin: GPIO4
  can_rx_pin: GPIO5
  # poll interval for RMI-property selects (they don't push changes like PDOs)
  property_poll_interval: 60s

canbus:
  - platform: esp32_can
    id: comfoair_can
    tx_pin: ${can_tx_pin}
    rx_pin: ${can_rx_pin}
    can_id: 0 # mandatory but we do not use it

logger:
  logs:
    canbus: INFO # the canbus component logs every received frame at DEBUG

zehnder_comfoair_q:
  id: comfoair
  property_poll_interval: ${property_poll_interval}

# HA action for automations: unlike the fan level select, this can be re-sent
# with the same level to restart the override/timer (safe-by-default
# patterns). duration_seconds > 0: level 3 uses the unit's native boost
# timer, other levels are emulated by the component (ESP-side auto-revert).
# 0 = the unit's default override duration (typically 2h, "Manual (limited)"),
# -1 = permanent boost timer (level 3 only).
api:
  actions:
    - action: set_fan_level
      variables:
        level: int
        duration_seconds: int
      then:
        - lambda: |-
            if (duration_seconds > 0)
              id(comfoair)->set_level_timer((uint8_t) level, (uint32_t) duration_seconds);
            else if (duration_seconds < 0)
              id(comfoair)->set_level_timer((uint8_t) level, 0xffffffff);
            else
              id(comfoair)->set_level((uint8_t) level);
